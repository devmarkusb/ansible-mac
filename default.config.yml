---
downloads: ~/.ansible-downloads/

configure_dotfiles: true
configure_terminal: true
configure_osx: true

# Set to 'true' to configure the Dock via dockutil.
configure_dock: true

# Dock tile size (matches current system setting of the machine).
dock_tilesize: 47

# Apps currently pinned in the Dock, in their current order (pos = 1-based position).
dockitems_remove: []
# - Launchpad
# - TV
# - Podcasts
# - 'App Store'
dockitems_persist:
  - { name: "Commander One", path: "/Applications/Commander One.app/", pos: 1 }
  - { name: "System Settings", path: "/System/Applications/System Settings.app/", pos: 2 }
  - { name: "KeePassXC", path: "/Applications/KeePassXC.app/", pos: 3 }
  - { name: "1Password", path: "/Applications/1Password.app/", pos: 4 }
  - { name: "Firefox", path: "/Applications/Firefox.app/", pos: 5 }
  - { name: "ChatGPT", path: "/Applications/ChatGPT.localized/ChatGPT.app/", pos: 6 }
  - { name: "CLion", path: "~/Applications/CLion.app/", pos: 7 }
  - { name: "GoLand", path: "~/Applications/GoLand.app/", pos: 8 }
  - { name: "WezTerm", path: "/Applications/WezTerm.app/", pos: 9 }
  - { name: "Calculator", path: "/System/Applications/Calculator.app/", pos: 10 }
  - { name: "Postman", path: "/Applications/Postman.app/", pos: 11 }
  - { name: "TigerVNC", path: "/Applications/TigerVNC.app/", pos: 12 }
  - { name: "OpenVPN Connect", path: "/Applications/OpenVPN Connect/OpenVPN Connect.app/", pos: 13 }
  - { name: "Activity Monitor", path: "/System/Applications/Utilities/Activity Monitor.app/", pos: 14 }
  - { name: "Slack", path: "/Applications/Slack.app/", pos: 15 }
  - { name: "Amphetamine", path: "/Applications/Amphetamine.app/", pos: 16 }

configure_sudoers: false
sudoers_custom_config: ''
# Example:
# sudoers_custom_config: |
#   # Allow users in admin group to use sudo with no password.
#   %admin ALL=(ALL) NOPASSWD: ALL

dotfiles_repo: https://github.com/geerlingguy/dotfiles.git
dotfiles_repo_accept_hostkey: true
dotfiles_repo_local_destination: ~/Development/GitHub/dotfiles
dotfiles_files:
  - .zshrc
  - .gitignore
  - .inputrc
  - .osx
  - .vimrc

homebrew_installed_packages:
  # - ansible # Installed via Pip.
  - autoconf
  - bash-completion
  - doxygen
  - gettext
  - gifsicle
  - git
  - gh
  - go
  - gpg
  - httpie
  - iperf
  - libevent
  - sqlite
  - mcrypt
  - nmap
  - node
  - nvm
  - php
  - ssh-copy-id
  - cowsay
  - readline
  - openssl
  - pv
  - wget
  - wrk
  - zsh-history-substring-search

# no homebrew_taps anymore, otherwise: Error: Tapping homebrew/core is no longer typically necessary.

homebrew_cask_appdir: /Applications
homebrew_cask_apps:
  - chromedriver
  - docker
  - dropbox
  - firefox
  - google-chrome
  - handbrake
  - licecap
  - sequel-ace
  - slack
  - sublime-text
  - transmit

# See `geerlingguy.mas` role documentation for usage instructions.
mas_installed_apps: []
mas_email: ""
mas_password: ""

osx_script: "~/.osx --no-restart"

# Install packages from other package managers.
# Note: You are responsible for making sure the required package managers are
# installed, eg. through homebrew.
composer_packages: []
# - name: drush
#   state: present # present/absent, default: present
#   version: "^8.1" # default: N/A
gem_packages: []
# - name: bundler
#   state: present # present/absent/latest, default: present
#   version: "~> 1.15.1" # default: N/A
npm_packages: []
# - name: webpack
#   state: present # present/absent/latest, default: present
#   version: "^2.6" # default: N/A
pip_packages: []
# - name: mkdocs
#   state: present # present/absent/latest, default: present
#   version: "0.16.3" # default: N/A

# Set to 'true' to configure Sublime Text.
configure_sublime: false
sublime_base_path: '~/Library/Application Support/Sublime Text'
sublime_config_path: "Packages/User"
sublime_package_control:
  - "DocBlockr"
  - "Dockerfile Syntax Highlighting"
  - "FileDiffs"
  - "GitHub Flavored Markdown Preview"
  - "Jinja2"
  - "Package Control"
  - "PHP-Twig"
  - "Pretty JSON"
  - "SublimeLinter"
  - "SublimeLinter-contrib-yamllint"
  - "TrailingSpaces"
  - "WordCount"

# Glob pattern to ansible task files to run after all other tasks are finished.
post_provision_tasks: []
