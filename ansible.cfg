[defaults]
nocows = True
# geerlingguy.mac collection uses bare ansible_user_id/gid — can't fix external code
deprecation_warnings = False
roles_path = ./roles:/etc/ansible/roles
inventory = inventory
become = true
# community.general.yaml subclasses AnsibleDumper; that breaks on Python 3.14 (TypeError: code must be code, not str).
stdout_callback = default
