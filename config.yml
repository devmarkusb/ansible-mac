---
downloads: ~/.ansible-downloads/

configure_dotfiles: true
configure_finder: true
configure_terminal: true
configure_osx: true

# Set to 'true' to configure the Dock via dockutil.
# Capture current layout: `dockutil --list`
configure_dock: true
dock_tilesize: 47
dockitems_remove: []
# Items listed here are "must-haves": if absent from the Dock they are added
# at the front (in list order). Existing items are never moved or removed.
dockitems_persist:
  - { name: "Commander One", path: "/Applications/Commander One.app/", pos: 1 }
  - { name: "System Settings", path: "/System/Applications/System Settings.app/", pos: 2 }
  - { name: "KeePassXC", path: "/Applications/KeePassXC.app/", pos: 3 }
  - { name: "1Password", path: "/Applications/1Password.app/", pos: 4 }
  - { name: "Firefox", path: "/Applications/Firefox.app/", pos: 5 }
  - { name: "ChatGPT", path: "/Applications/ChatGPT.localized/ChatGPT.app/", pos: 6 }
  - { name: "CLion", path: "~/Applications/CLion.app/", pos: 7 }
  - { name: "GoLand", path: "~/Applications/GoLand.app/", pos: 8 }
  - { name: "WezTerm", path: "/Applications/WezTerm.app/", pos: 9 }
  - { name: "Calculator", path: "/System/Applications/Calculator.app/", pos: 10 }
  - { name: "Postman", path: "/Applications/Postman.app/", pos: 11 }
  - { name: "TigerVNC", path: "/Applications/TigerVNC.app/", pos: 12 }
  - { name: "OpenVPN Connect", path: "/Applications/OpenVPN Connect/OpenVPN Connect.app/", pos: 13 }
  - { name: "Activity Monitor", path: "/System/Applications/Utilities/Activity Monitor.app/", pos: 14 }
  - { name: "Slack", path: "/Applications/Slack.app/", pos: 15 }
  # Document on the Dock (right / Documents strip); path must match the file.
  - { name: "tmp.md", path: "~/tmp.md", pos: 16 }

configure_sudoers: true
sudoers_custom_config: |
  # Allow users in admin group to use sudo with no password.
  %admin ALL=(ALL) NOPASSWD: ALL
# Example:
# sudoers_custom_config: |
#   # Allow users in admin group to use sudo with no password.
#   %admin ALL=(ALL) NOPASSWD: ALL

dotfiles_repo: https://github.com/geerlingguy/dotfiles.git
dotfiles_repo_accept_hostkey: true
dotfiles_repo_local_destination: ~/dotfiles-src
dotfiles_files:
  - .inputrc
  - .osx

homebrew_installed_packages:
  # - ansible # Installed via Pip.
  - anomalyco/tap/opencode
  - autoconf
  - bash-completion
  - cmake
  - doxygen
  - espanso
  - gettext
  - ghex
  - gifsicle
  - git
  - git-lfs
  - gh
  #- go
  - gpg
  - graphviz
  - htop
  - httpie
  - hwloc
  - iperf
  - libevent
  - sqlite
  - llvm
  - mc
  - mcrypt
  # don't know, 'Not upgrading libsk-libfido2-install, the latest version is already installed'
  #- michaelroosz/ssh/libsk-libfido2-install
  - ninja
  - nmap
  - node
  - nvm
  - rg
  - rtk
  - ssh-copy-id
  - theseal/ssh-askpass/ssh-askpass
  - tree
  - cowsay
  - readline
  - openfortivpn
  - openssh
  - openssl
  - pv
  - qt5
  - smart-mcp-proxy/mcpproxy/mcpproxy
  - uv
  - wget
  - wrk
  - zsh-history-substring-search

homebrew_cask_appdir: /Applications
homebrew_cask_apps:
  - 1password
  - 1password-cli
  #- clion # for now installed via jetbrains toolbox
  - chatgpt
  - commander-one
  - meld
  #- docker # provided by orbstack; cask conflicts with /usr/local/bin/docker-credential-osxkeychain
  #- dropbox # for now installed manually via c24 sc
  #- firefox # for now installed manually via c24 sc
  #- jetbrains-toolbox # for now seemingly installed via download package
  #- goland # for now installed via jetbrains toolbox
  - handbrake
  #- intellij-idea # for now installed via jetbrains toolbox
  - karabiner-elements
  # could need --no-quarantine when installing
  - kdiff3
  - keepassxc
  - libreoffice
  - licecap
  - nextcloud
  #- openvpn-connect # for now installed manually via c24 sc
  - orbstack
  - postman
  #- pycharm # for now installed via jetbrains toolbox
  - sequel-ace
  - stats
  - stay
  #- slack # for now installed manually via c24 sc
  - tigervnc-viewer
  - transmit
  - vagrant
  - visual-studio-code
  - wine-stable
  - yubico-authenticator
  #- zoom # for now installed manually via c24 sc

# See `geerlingguy.mas` role documentation for usage instructions.
mas_installed_apps: []
mas_email: ""
mas_password: ""

osx_script: "~/.osx --no-restart"

# Install packages from other package managers.
# Note: You are responsible for making sure the required package managers are
# installed, eg. through homebrew.
composer_packages: []
# - name: drush
#   state: present # present/absent, default: present
#   version: "^8.1" # default: N/A
gem_packages: []
# - name: bundler
#   state: present # present/absent/latest, default: present
#   version: "~> 1.15.1" # default: N/A
npm_packages: []
# - name: webpack
#   state: present # present/absent/latest, default: present
#   version: "^2.6" # default: N/A
pip_packages: []
# - name: mkdocs
#   state: present # present/absent/latest, default: present
#   version: "0.16.3" # default: N/A

# Set to 'true' to configure Sublime Text.
configure_sublime: false

# Glob pattern to ansible task files to run after all other tasks are finished.
post_provision_tasks: []
