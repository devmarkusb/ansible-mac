---
downloads: ~/.ansible-downloads/

configure_dotfiles: true
configure_finder: true
configure_terminal: true
configure_osx: true

# Set to 'true' to configure the Dock via dockutil.
# Capture current layout: `dockutil --list`
configure_dock: true
dockitems_remove: []
dockitems_persist:
  - name: "Commander One"
    path: "/Applications/Commander One.app/"
    pos: 1
  - name: "System Settings"
    path: "/System/Applications/System Settings.app/"
    pos: 2
  - name: "KeePassXC"
    path: "/Applications/KeePassXC.app/"
    pos: 3
  - name: "1Password"
    path: "/Applications/1Password.app/"
    pos: 4
  - name: "Firefox"
    path: "/Applications/Firefox.app/"
    pos: 5
  - name: "ChatGPT"
    path: "/Applications/ChatGPT.app/"
    pos: 6
  - name: "Postman"
    path: "/Applications/Postman.app/"
    pos: 7
  - name: "VNC Viewer"
    path: "/Applications/VNC Viewer.app/"
    pos: 8
  - name: "OpenVPN Connect"
    path: "/Applications/OpenVPN Connect/OpenVPN Connect.app/"
    pos: 9
  - name: "Stats"
    path: "/Applications/Stats.app/"
    pos: 10
  - name: "Activity Monitor"
    path: "/System/Applications/Utilities/Activity Monitor.app/"
    pos: 11
  - name: "WezTerm"
    path: "/Applications/WezTerm.app/"
    pos: 12
  - name: "PyCharm"
    path: "/Applications/PyCharm.app/"
    pos: 13
  - name: "CLion 2026.1"
    path: "/Users/markus.borris/Applications/CLion 2026.1.app/"
    pos: 14
  - name: "GoLand"
    path: "/Users/markus.borris/Applications/GoLand.app/"
    pos: 15
  - name: "Calculator"
    path: "/System/Applications/Calculator.app/"
    pos: 16
  - name: "Slack"
    path: "/Applications/Slack.app/"
    pos: 17
  # Was in recentApps; listing here pins it like the rest.
  - name: "OrbStack"
    path: "/Applications/OrbStack.app/"
    pos: 18
  # Document on the Dock (right / Documents strip); path must match the file.
  - name: "tmp.md"
    path: "/Users/markus.borris/CHECK24 Reise Ges. Dropbox/Markus Borris/tmp.md"
    pos: 19

configure_sudoers: true
sudoers_custom_config: |
  # Allow users in admin group to use sudo with no password.
  %admin ALL=(ALL) NOPASSWD: ALL
# Example:
# sudoers_custom_config: |
#   # Allow users in admin group to use sudo with no password.
#   %admin ALL=(ALL) NOPASSWD: ALL

dotfiles_repo: https://github.com/geerlingguy/dotfiles.git
dotfiles_repo_accept_hostkey: true
dotfiles_repo_local_destination: ~/dotfiles-src
dotfiles_files:
  - .inputrc
  - .osx

homebrew_installed_packages:
  # - ansible # Installed via Pip.
  - autoconf
  - bash-completion
  - cmake
  - doxygen
  - gettext
  - ghex
  - gifsicle
  - git
  - git-lfs
  - gh
  #- go
  - gpg
  - graphviz
  - htop
  - httpie
  - hwloc
  - iperf
  - libevent
  - sqlite
  - llvm
  - mc
  - mcrypt
  # don't know, 'Not upgrading libsk-libfido2-install, the latest version is already installed'
  #- michaelroosz/ssh/libsk-libfido2-install
  - ninja
  - nmap
  - node
  - nvm
  - rg
  - ssh-copy-id
  - theseal/ssh-askpass/ssh-askpass
  - tree
  - cowsay
  - readline
  - openfortivpn
  - openssh
  - openssl
  - pv
  - qt5
  - uv
  - wget
  - wrk
  - zsh-history-substring-search

homebrew_cask_appdir: /Applications
homebrew_cask_apps:
  - 1password
  #- clion # for now installed via jetbrains toolbox
  - chatgpt
  - commander-one
  - meld
  - docker
  #- dropbox # for now installed manually via c24 sc
  #- firefox # for now installed manually via c24 sc
  #- jetbrains-toolbox # for now seemingly installed via download package
  #- goland # for now installed via jetbrains toolbox
  - handbrake
  - insomnia
  #- intellij-idea # for now installed via jetbrains toolbox
  - karabiner-elements
  # could need --no-quarantine when installing
  - kdiff3
  - keepassxc
  - libreoffice
  - licecap
  - nextcloud
  #- openvpn-connect # for now installed manually via c24 sc
  - orbstack
  - postman
  - pycharm
  - sequel-ace
  - stats
  - stay
  #- slack # for now installed manually via c24 sc
  - tigervnc-viewer
  - transmit
  - vagrant
  - visual-studio-code
  - wine-stable
  - yubico-yubikey-manager
