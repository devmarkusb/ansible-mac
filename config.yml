---
downloads: ~/.ansible-downloads/

configure_dotfiles: true
configure_finder: true
configure_terminal: true
configure_osx: true

# Set to 'true' to configure the Dock via dockutil.
# List current state with `dockutil -L`
configure_dock: true
dockitems_remove: [TV, Podcasts, Safari, Mail, Calendar, Reminders, Notes, Freeform, Dropbox]
dockitems_persist:
  - name: "Launchpad"
    path: "/System/Applications/Launchpad.app/"
    pos: 1
  - name: "System Settings"
    path: "/System/Applications/System Settings.app/"
    pos: 2
  - name: "Software Center"
    path: "/Applications/Software Center.app/"
    pos: 3
  - name: "KeePassXC"
    path: "/Applications/KeePassXC.app/"
    pos: 4
  - name: "Terminal"
    path: "/Applications/Terminal.app/"
    pos: 5
  - name: "Firefox"
    path: "/Applications/Firefox.app/"
    pos: 6
#   - name: "PyCharm.app"
#     path: "/Applications/PyCharm.app/"
#     pos: 7
#   - name: "CLion.app"
#     path: "/Applications/CLion.app/"
#     pos: 8
  - name: "GoLand"
    path: "/Applications/GoLand.app/"
    pos: 9
#   - name: "TigerVNC Viewer 1.14.1"
#     path: "/Applications/TigerVNC Viewer 1.14.1.app/"
#     pos: 10
  - name: "VNC Viewer"
    path: "/Applications/VNC Viewer.app/"
    pos: 10
  - name: "Insomnia"
    path: "/Applications/Insomnia.app/"
    pos: 11
  - name: "Postman"
    path: "/Applications/Postman.app/"
    pos: 12
  - name: "Music"
    path: "/Applications/Music.app/"
    pos: 13
  - name: "OpenVPN Connect"
    path: "/Applications/OpenVPN Connect.app/"
    pos: 14
  - name: "Stats"
    path: "/Applications/Stats.app/"
    pos: 15
  - name: "Activity Monitor"
    path: "/Applications/Utilities/Activity Monitor.app/"
    pos: 16
  - name: "Karabiner-Elements"
    path: "/Applications/Karabiner-Elements.app/"
    pos: 17
tags: ['dock']

configure_sudoers: true
sudoers_custom_config: |
  # Allow users in admin group to use sudo with no password.
  %admin ALL=(ALL) NOPASSWD: ALL
# Example:
# sudoers_custom_config: |
#   # Allow users in admin group to use sudo with no password.
#   %admin ALL=(ALL) NOPASSWD: ALL

dotfiles_repo: https://github.com/geerlingguy/dotfiles.git
dotfiles_repo_accept_hostkey: true
dotfiles_repo_local_destination: ~/dotfiles-src
dotfiles_files:
  - .inputrc
  - .osx

homebrew_installed_packages:
  # - ansible # Installed via Pip.
  - autoconf
  - bash-completion
  - cmake
  - doxygen
  - gettext
  - ghex
  - gifsicle
  - git
  - github/gh/gh
  #- go
  - gpg
  - graphviz
  - htop
  - httpie
  - hwloc
  - iperf
  - libevent
  - sqlite
  - llvm
  - mc
  - mcrypt
  # don't know, 'Not upgrading libsk-libfido2-install, the latest version is already installed'
  #- michaelroosz/ssh/libsk-libfido2-install
  - ninja
  - nmap
  - node
  - nvm
  - ssh-copy-id
  - theseal/ssh-askpass/ssh-askpass
  - tree
  - cowsay
  - readline
  - openfortivpn
  - openssh
  - openssl
  - pv
  - qt5
  - wget
  - wrk
  - zsh-history-substring-search

homebrew_cask_appdir: /Applications
homebrew_cask_apps:
  #- clion # for now installed via jetbrains toolbox
  - docker
  #- dropbox # for now installed manually via c24 sc
  #- firefox # for now installed manually via c24 sc
  #- jetbrains-toolbox # for now seemingly installed via download package
  #- goland # for now installed via jetbrains toolbox
  - handbrake
  - insomnia
  #- intellij-idea # for now installed via jetbrains toolbox
  - karabiner-elements
  - kdiff3
  - keepassxc
  - libreoffice
  - licecap
  #- meld # not working
  - nextcloud
  #- openvpn-connect # for now installed manually via c24 sc
  - pycharm
  - sequel-ace
  - stats
  - stay
  #- slack # for now installed manually via c24 sc
  - tigervnc-viewer
  - transmit
  - vagrant
  - visual-studio-code
  - wine-stable
  - yubico-yubikey-manager
  #- zoom # for now installed manually via c24 sc

# See `geerlingguy.mas` role documentation for usage instructions.
mas_installed_apps: []
mas_email: ""
mas_password: ""

osx_script: "~/.osx --no-restart"

# Install packages from other package managers.
# Note: You are responsible for making sure the required package managers are
# installed, eg. through homebrew.
composer_packages: []
# - name: drush
#   state: present # present/absent, default: present
#   version: "^8.1" # default: N/A
gem_packages: []
# - name: bundler
#   state: present # present/absent/latest, default: present
#   version: "~> 1.15.1" # default: N/A
npm_packages: []
# - name: webpack
#   state: present # present/absent/latest, default: present
#   version: "^2.6" # default: N/A
pip_packages: []
# - name: mkdocs
#   state: present # present/absent/latest, default: present
#   version: "0.16.3" # default: N/A

# Set to 'true' to configure Sublime Text.
configure_sublime: false

# Glob pattern to ansible task files to run after all other tasks are finished.
post_provision_tasks: []
